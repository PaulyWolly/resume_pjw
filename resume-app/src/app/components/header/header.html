<header class="resume-header">
  <div class="resume-header__banner">
    <h1 class="resume-header__name">{{ name() }}</h1>
    <p class="resume-header__headline">{{ headline() }}</p>

    <div class="resume-header__contact">
      <p class="resume-header__contact-line">
        <a [href]="'mailto:' + contact().email">{{ contact().email }}</a>
        <span class="resume-header__sep" aria-hidden="true">|</span>
        <button
          type="button"
          class="resume-header__location"
          (click)="openMap()"
          title="View on Google Maps"
        >
          {{ contact().location }}
        </button>
        <span class="resume-header__sep" aria-hidden="true">|</span>
        <a [href]="phoneHref(contact().phone)">{{ contact().phone }}</a>
      </p>

      <p class="resume-header__contact-line">
        @for (link of contact().links; track link.href; let i = $index) {
          @if (i > 0) {
            <span class="resume-header__sep" aria-hidden="true">|</span>
          }
          <a [href]="link.href" target="_blank" rel="noopener noreferrer">{{ link.value }}</a>
        }
      </p>
    </div>
  </div>

  <section class="resume-header__summary">
    <h2 class="section-title">Summary</h2>
    <p>{{ summary() }}</p>
  </section>
</header>

@if (mapOpen()) {
  <div class="map-modal" (click)="closeMap()">
    <div
      class="map-modal__dialog"
      role="dialog"
      aria-modal="true"
      aria-label="Location map"
      (click)="$event.stopPropagation()"
    >
      <div class="map-modal__header">
        <span class="map-modal__title">{{ contact().location }}</span>
        <button
          type="button"
          class="map-modal__close"
          (click)="closeMap()"
          aria-label="Close map"
        >
          ✕
        </button>
      </div>

      <iframe
        class="map-modal__frame"
        [src]="mapEmbedUrl()"
        title="Google Map"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>

      <div class="map-modal__footer">
        <a
          class="map-modal__link"
          [href]="mapExternalUrl()"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open in Google Maps
        </a>
      </div>
    </div>
  </div>
}
